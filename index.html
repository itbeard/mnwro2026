<!DOCTYPE html>
<html lang="be">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Закрыццё сезона «Мова Нанова» — Замак у Алясьніцы</title>
  <link rel="icon" href="logo.jpg" />

  <!-- Колер панэлі браўзера на мабільным (БЧБ чырвоны) -->
  <meta name="theme-color" content="#ce1720" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Шрыфт -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" />

  <!-- Нашыя стылі (?v= — каб браўзер не браў старую версію з кэшу) -->
  <link rel="stylesheet" href="styles.css?v=7" />
</head>

<body>

  <div id="splash">
    <img class="splash-logo" src="logo.jpg" alt="" />
    <div class="splash-name">Мова Нанова</div>
    <div class="splash-sub">Уроцлаў · мапа мерапрыемства</div>
    <div class="splash-hearts">🤍&nbsp;❤️&nbsp;🤍</div>
  </div>

  <div id="map"></div>

  <header class="topbar">
    <img class="logo" src="logo.jpg" alt="Мова Нанова — Уроцлаў" />
    <div class="title-wrap">
      <h1>Закрыццё сезона «Мова Нанова» 2026</h1>
      <p class="sub">Мапа мерапрыемства</p>
    </div>
    <div class="topbar-actions">
      <a class="icon-ghost" href="https://docs.google.com/document/d/1XAA1E0c8juJEnZlOjXXC5dqfqifM4jp5eu2ONkAhLDg/edit?usp=drivesdk"
         target="_blank" rel="noopener" title="Праграма і ўся інфармацыя" aria-label="Праграма">📋</a>
      <button class="toggle-list" id="toggleList">Зоны</button>
    </div>
  </header>

  <div class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle">
      <span class="bar"></span>
      <strong>Зоны мерапрыемства</strong>
      <span class="count" id="zoneCount"></span>
    </div>
    <div class="search">
      <div class="search-in">
        <span>🔍</span>
        <input id="zoneSearch" type="text" placeholder="Шукаць зону…" autocomplete="off" />
        <button type="button" id="zoneSearchClear" class="search-clear" hidden>✕</button>
      </div>
    </div>
    <div class="zone-list" id="zoneList"></div>
    <div class="sheet-footer">🤍&nbsp;❤️&nbsp;🤍&nbsp;&nbsp;<a class="tg-link" href="https://t.me/movananovauro" target="_blank" rel="noopener">Тэлеграм-суполка Мова Нанова Уроцлаў</a></div>
  </div>

  <!-- Спачатку дадзеныя зон, потым логіка (?v= супраць кэшу) -->
  <script src="zones.js?v=5"></script>
  <script src="app.js?v=7"></script>
</body>

</html>
